# Fabrication de l'installeur Windows : npm run dist  →  dist/GoClip-Setup-<version>.exe
appId: fr.autoclip.app
productName: GoClip
# Nom interne gardé (AutoClip.exe, données dans %APPDATA%\AutoClip) : les AutoClip déjà installés
# passent à GoClip par la mise à jour sans rien perdre (réglages, outils, lancement avec Windows).
executableName: AutoClip
extraMetadata:
  productName: AutoClip
directories:
  output: dist
  buildResources: resources
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  - package.json
extraResources:
  - from: resources/fonts
    to: fonts
  - from: resources/icon.png
    to: icon.png
asar: true
win:
  target: nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: GoClip-Setup-${version}.${ext}
  shortcutName: GoClip
# Mises à jour automatiques : chaque version publiée avec « npm run release » sur GitHub
# est proposée à tous ceux qui ont installé GoClip. Remplace CHANGE-MOI par ton pseudo GitHub
# (dépôt public « GoClip » ; voir README, section « Publier une mise à jour »).
publish:
  provider: github
  owner: zaakrotv
  repo: GoClip
  releaseType: release
